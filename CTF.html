<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dougan's Blog - CTF Note</title>
    <style>
        :root {
            --bg: #f4f7f6; --header-bg: #fff; --text: #333; --card: #fff; --border: #eee; --accent: #3498db; --code: #f8f9fa;
        }
        [data-theme="dark"] {
            --bg: #181a1b; --header-bg: #242627; --text: #e8e6e3; --card: #242627; --border: #3c4143; --accent: #5dade2; --code: #2d2f31;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; transition: background 0.3s, color 0.3s; }
        body { font-family: "PingFang TC", sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }

        header { background: var(--header-bg); border-bottom: 1px solid var(--border); padding: 1rem 10%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .logo { font-size: 1.5rem; font-weight: bold; color: var(--accent); text-decoration: none; cursor: pointer; }
        
        #theme-btn { cursor: pointer; padding: 6px 12px; border-radius: 20px; border: 1px solid var(--accent); background: transparent; color: var(--accent); font-weight: bold; }

        .hero { background: #2c3e50; color: #fff; padding: 60px 10%; text-align: center; }
        .container { display: grid; grid-template-columns: 2.5fr 1fr; gap: 30px; padding: 40px 10%; max-width: 1200px; margin: 0 auto; }

        .post-card, aside, .article-box { background: var(--card); padding: 30px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 25px; }
        .read-more, .nav-btn { color: var(--accent); text-decoration: none; font-weight: bold; cursor: pointer; display: inline-block; margin-top: 15px; }

        /* 文章內頁專用樣式 */
        #article-view { max-width: 800px; margin: 40px auto; display: none; padding: 0 20px; }
        pre { background: var(--code); padding: 15px; border-radius: 8px; overflow-x: auto; border: 1px solid var(--border); margin: 15px 0; }
        .nav-area { display: flex; justify-content: space-between; margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--border); }

        @media (max-width: 850px) { .container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="showList()">Dougan Blog</div>
        <button id="theme-btn">🌙 切換模式</button>
    </header>

    <!-- 1. 列表視圖 -->
    <div id="list-view">
        <section class="hero">
            <h1>歡迎來到我的創作空間</h1>
            <p>記錄生活、技術與靈感的集散地</p>
        </section>

        <div class="container">
            <main>
                <article class="post-card">
                    <div style="color:#999; font-size:0.8rem;">2025年3月30日</div>
                    <h2>Lord of SQLInjection: los.rubiya</h2>
                    <p>這是一系列關於 SQL Injection 的解題紀錄，從基礎的 Gremlin 開始...</p>
                    <a class="read-more" onclick="showArticle('sqli', 1)">繼續閱讀 →</a>
                </article>

                <article class="post-card">
                    <div style="color:#999; font-size:0.8rem;">2024年3月15日</div>
                    <h2>為什麼我選擇簡約設計？</h2>
                    <p>在資訊爆炸的時代，乾淨的介面能讓讀者更專注於文字本身...</p>
                    <a class="read-more" onclick="showArticle('design', 1)">繼續閱讀 →</a>
                </article>
            </main>

            <aside>
                <h3>分類標籤</h3>
                <p style="margin-top:10px; opacity:0.8;"># 技術筆記<br># CTF<br># 漏洞專區</p>
            </aside>
        </div>
    </div>

    <!-- 2. 文章視圖 (預設隱藏) -->
    <div id="article-view">
        <div class="nav-btn" onclick="showList()">← 返回列表</div>
        <div class="article-box">
            <div id="article-content">
                <!-- 內容由 JS 注入 -->
            </div>
            <div class="nav-area" id="article-nav">
                <!-- 分頁按鈕由 JS 注入 -->
            </div>
        </div>
    </div>

    <script>
        // 文章數據庫 (支援分頁)
        const postData = {
            'sqli': {
                1: {
                    title: "los.rubiya - 第一頁：基礎概念",
                    content: `<p>Gremlin 關卡是 LOB 的起點。源碼如下：</p><pre><code>$query = "select id from prob_gremlin where id='{$_GET[id]}' and pw='{$_GET[pw]}'";</code></pre><p>我們只需讓 Query 恆真即可繞過。</p>`
                },
                2: {
                    title: "los.rubiya - 第二頁：進階繞過",
                    content: `<p>當 <code>'</code> 被過濾時，我們可以使用 hex 或其他編碼方式...</p><pre><code>admin' # -> admin%27%23</code></pre><p>這是進階頁面的內容演示。</p>`
                }
            },
            'design': {
                1: {
                    title: "為什麼我選擇簡約設計？",
                    content: `<p>簡約不代表簡單。它是一種專注於核心價值的設計哲學。</p>`
                }
            }
        };

        const listView = document.getElementById('list-view');
        const articleView = document.getElementById('article-view');
        const articleContent = document.getElementById('article-content');
        const articleNav = document.getElementById('article-nav');

        // 顯示文章功能
        function showArticle(postId, page) {
            const post = postData[postId] && postData[postId][page];
            if (!post) return;

            // 隱藏列表，顯示文章
            listView.style.display = 'none';
            articleView.style.display = 'block';

            // 注入內容
            articleContent.innerHTML = `
                <h1 style="color:var(--accent); margin-bottom:10px;">${post.title}</h1>
                <hr style="border:0; border-top:1px solid var(--border); margin-bottom:20px;">
                <div style="font-size:1.1rem; line-height:1.8;">${post.content}</div>
            `;

            // 處理分頁按鈕
            let navHtml = '';
            // 上一頁按鈕
            if (page > 1) {
                navHtml += `<span class="nav-btn" onclick="showArticle('${postId}', ${page - 1})">← 上一頁</span>`;
            } else {
                navHtml += `<span></span>`;
            }
            // 下一頁按鈕
            if (postData[postId][page + 1]) {
                navHtml += `<span class="nav-btn" onclick="showArticle('${postId}', ${page + 1})">下一頁 →</span>`;
            } else {
                navHtml += `<span></span>`;
            }
            articleNav.innerHTML = navHtml;
            window.scrollTo(0, 0);
        }

        // 返回列表功能
        function showList() {
            articleView.style.display = 'none';
            listView.style.display = 'block';
            window.scrollTo(0, 0);
        }

        // 深色模式切換
        const btn = document.getElementById('theme-btn');
        const html = document.documentElement;
        btn.addEventListener('click', () => {
            if (html.getAttribute('data-theme') === 'dark') {
                html.removeAttribute('data-theme');
                btn.innerText = '🌙 深色模式';
            } else {
                html.setAttribute('data-theme', 'dark');
                btn.innerText = '☀️ 淺色模式';
            }
        });
    </script>
</body>
</html>
