<body>

    <header>
        <a href="#" class="logo" onclick="showList()">Dougan Blog</a>
        <button id="theme-btn">🌙 切換模式</button>
    </header>

    <!-- 1. 列表頁面 (預設顯示) -->
    <div id="list-view">
        <section class="hero">
            <h1>歡迎來到我的創作空間</h1>
            <p>記錄生活、技術與靈感的集散地</p>
        </section>

        <div class="container">
            <main>
                <!-- 文章 1 -->
                <article class="post-card">
                    <div class="post-date">2025年3月30日</div>
                    <h2>los.rubiya</h2>
                    <p>Lord of SQLInjection 的第一關：Gremlin。這關主要測試最基礎的 SQL Injection 繞過技巧...</p>
                    <!-- 傳入 ID 決定顯示哪篇內容 -->
                    <a href="javascript:void(0)" class="read-more" onclick="showArticle('sqli')">繼續閱讀 →</a>
                </article>

                <!-- 文章 2 -->
                <article class="post-card">
                    <div class="post-date">2024年3月15日</div>
                    <h2>為什麼我選擇簡約設計？</h2>
                    <p>在資訊爆炸的時代，乾淨的介面能讓讀者更專注於文字本身。這份 HTML 程式碼完全不依賴外部資料庫...</p>
                    <a href="javascript:void(0)" class="read-more" onclick="showArticle('design')">繼續閱讀 →</a>
                </article>
            </main>

            <aside>
                <h3>分類標籤</h3>
                <ul class="categories">
                    <li><a href="#"># 技術筆記</a></li>
                    <li><a href="#"># 漏洞專區</a></li>
                </ul>
            </aside>
        </div>
    </div>

    <!-- 2. 文章內容頁面 (預設隱藏) -->
    <div id="article-view" style="display: none; padding: 40px 10%; max-width: 900px; margin: 0 auto;">
        <button onclick="showList()" style="background:none; border:none; color:var(--accent); cursor:pointer; font-weight:bold; margin-bottom:20px;">← 返回文章列表</button>
        <div id="article-content">
            <!-- 內容由 JS 動態填充 -->
        </div>
    </div>

    <script>
        // 文章資料庫
        const postData = {
            'sqli': {
                title: "Lord of SQLInjection: los.rubiya (Gremlin)",
                date: "2025年3月30日",
                content: `
                    <p>這是 SQLI 的入門，目標是讓 Query 恆真。</p>
                    <pre style="background:var(--border); padding:15px; border-radius:8px; overflow-x:auto;"><code>$query = "select id from prob_gremlin where id='{$_GET[id]}' and pw='{$_GET[pw]}'";</code></pre>
                    <p><strong>Payload:</strong> <code>?id=admin' or 1=1 -- </code></p>
                    <p>重點在於使用單引號閉合並用 <code>--</code> 註解掉後方內容。</p>`
            },
            'design': {
                title: "為什麼我選擇簡約設計？",
                date: "2024年3月15日",
                content: `<p>簡約設計能減少視覺噪音，讓內容說話。透過 CSS 變數，我們能輕鬆達成深淺色切換...</p>`
            }
        };

        const listView = document.getElementById('list-view');
        const articleView = document.getElementById('article-view');
        const articleContent = document.getElementById('article-content');

        // 顯示文章
        function showArticle(id) {
            const post = postData[id];
            if (!post) return;

            articleContent.innerHTML = `
                <h1 style="font-size: 2.5rem; color:var(--accent);">${post.title}</h1>
                <div style="color: #999; margin-bottom: 20px;">${post.date}</div>
                <hr style="border: 0; border-top: 1px solid var(--border); margin-bottom: 30px;">
                <div style="line-height: 1.8; font-size: 1.1rem;">${post.content}</div>
            `;

            listView.style.display = 'none';
            articleView.style.display = 'block';
            window.scrollTo(0, 0); // 回到頂部
        }

        // 返回列表
        function showList() {
            articleView.style.display = 'none';
            listView.style.display = 'block';
        }

        // 原有的深色模式邏輯 (保留)
        const btn = document.getElementById('theme-btn');
        const html = document.documentElement;
        btn.addEventListener('click', () => {
            if (html.getAttribute('data-theme') === 'dark') {
                html.removeAttribute('data-theme');
                btn.innerText = '🌙 深色模式';
            } else {
                html.setAttribute('data-theme', 'dark');
                btn.innerText = '☀️ 淺色模式';
            }
        });
    </script>
</body>
